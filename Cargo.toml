[package]
name = "bevy_pg_nav"
version = "1.30.0"
edition = "2024"
description = "PG (PatchGames) Navigation to be used with Bevy"
license = "MIT OR Apache-2.0"

[features]


[dependencies]
bevy = {version = "0.20", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_window",
    "bevy_gizmos",
    "bevy_pbr"
]}
serde = "1.0"
serde_json = "1.0"
libm = "0.2"
bevy_common_assets = {version = "0.18.0", default-features = false, features = ["json"]}
itertools = "0.13.0"
smallvec = { version = "1.16", features = ["union", "const_generics","serde"] }
ordered-float = "5.5"
num-traits = "0.2.19"
bevy_pg_core = {version="1.20.0", git="https://www.github.com/PatrickChodowski/bevy_pg_core"}
avian3d = {version = "0.8", default-features = false, features = [
    "3d",
    "parry-f32", 
    "collider-from-mesh"
]}
dashmap = {version="6.2.1", features = ["rayon"] }
rayon = "1.12.0"
earcutr = "0.5.0"
bevy_rerecast = "0.6.1"
avian_rerecast = "0.7.1"
rerecast = "0.5.1"

